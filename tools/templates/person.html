<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Generated by tools/build_people.py from tools/templates/person.html. Do not edit by hand. -->
<title>{{NAME}} — Kindred — Adam Lozo</title>
<meta name="description" content="{{NAME}}, from Kindred, a series by Adam Lozo. {{SUMMARY}}">
<link rel="canonical" href="https://adamlozo.com/{{PAGE}}/{{SLUG}}/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
{{STYLE}}
</head>
<body data-slug="{{SLUG}}">

<div class="aurora" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="frame">

  <header class="hud">
    <a class="back" href="/{{PAGE}}/">&larr; Back to Kindred</a>
    <span>The People</span>
  </header>

  <section class="hero">
    <p class="kicker">Kindred · The People</p>
    <h1 id="p-name">{{NAME}}</h1>
    <p class="c-style" id="p-group"></p>
    <p class="sub" id="p-intro"></p>
  </section>

  <div class="section-head">
    <span>In facet order</span>
    <span id="count"></span>
  </div>

  <main id="facets" class="series" aria-live="polite">
    <noscript><p class="status">This page needs JavaScript to load.</p></noscript>
  </main>

  <section class="seen-in" id="seen-in" hidden>
    <h2>Seen in the series:</h2>
    <ul id="seen-list"></ul>
  </section>

  <footer class="footer">
    <a href="/{{PAGE}}/">&larr; Back to Kindred</a>
    <a href="mailto:adam@adamlozo.com">adam@adamlozo.com</a>
  </footer>

</div>

<dialog id="lb" class="lb" aria-label="Image viewer">
  <div class="lb-inner">
    <img class="lb-img" id="lb-img" alt="">
    <div class="lb-cap">
      <h2 class="lb-title" id="lb-title"></h2>
      <p class="c-style" id="lb-style"></p>
      <p class="c-desc" id="lb-desc"></p>
      <p class="c-evidence" id="lb-evidence"></p>
      <div class="lb-meta">
        <span id="lb-pos"></span>
        <a id="lb-full" href="#" target="_blank" rel="noopener">Open full size</a>
      </div>
    </div>
  </div>
  <button type="button" class="lb-btn lb-close" id="lb-close" aria-label="Close">&times;</button>
  <button type="button" class="lb-btn lb-prev" id="lb-prev" aria-label="Previous image">&larr;</button>
  <button type="button" class="lb-btn lb-next" id="lb-next" aria-label="Next image">&rarr;</button>
</dialog>

<script>
(function () {
  var slug = document.body.getAttribute('data-slug');
  var list = document.getElementById('facets');
  var count = document.getElementById('count');
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lb-img');
  var lbTitle = document.getElementById('lb-title');
  var lbStyle = document.getElementById('lb-style');
  var lbDesc = document.getElementById('lb-desc');
  var lbEvidence = document.getElementById('lb-evidence');
  var lbPos = document.getElementById('lb-pos');
  var lbFull = document.getElementById('lb-full');

  var person = null;
  var items = [];
  var current = -1;
  var lastTrigger = null;
  var loadToken = 0;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  // Same rule as anchor() on /{{PAGE}}/, for example 01-the-hearth.
  function anchor(number, title) {
    return (number + '-' + title).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  function showError() {
    list.textContent = '';
    list.appendChild(el('p', 'status', 'This page could not be loaded. Please try again later.'));
    count.textContent = '';
  }

  function render(series) {
    document.getElementById('p-name').textContent = person.name;
    document.getElementById('p-group').textContent = person.group;
    document.getElementById('p-intro').textContent = person.intro;
    var frag = document.createDocumentFragment();
    items.forEach(function (it, i) {
      var plate = el('article', 'plate');
      plate.id = anchor(it.number, it.facet);
      var btn = el('button', 'shot');
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Open ' + it.number + ' ' + it.facet);
      var img = document.createElement('img');
      img.src = it.display;
      img.width = it.width;
      img.height = it.height;
      img.alt = it.alt || '';
      img.loading = i < 2 ? 'eager' : 'lazy';
      img.decoding = 'async';
      btn.appendChild(img);
      btn.addEventListener('click', function () { open(i, btn); });
      plate.appendChild(btn);
      var cap = el('div', 'plate-cap');
      cap.appendChild(el('p', 'c-num', it.number));
      cap.appendChild(el('h2', 'c-title', it.facet));
      cap.appendChild(el('p', 'c-desc', it.description_1));
      cap.appendChild(el('p', 'c-evidence', it.description_2));
      plate.appendChild(cap);
      frag.appendChild(plate);
    });
    list.textContent = '';
    list.appendChild(frag);
    count.textContent = items.length + ' facets';

    var seen = document.getElementById('seen-list');
    (person.seen_in || []).forEach(function (n) {
      var s = series.images.filter(function (e) { return e.number === n; })[0];
      if (!s) return;
      var li = el('li');
      var a = el('a');
      a.href = '/{{PAGE}}/#' + anchor(s.number, s.title);
      a.appendChild(el('span', 'c-num', s.number));
      a.appendChild(document.createTextNode(' ' + s.title));
      li.appendChild(a);
      seen.appendChild(li);
    });
    if (seen.children.length) document.getElementById('seen-in').hidden = false;
  }

  function show(i) {
    var n = items.length;
    current = (i + n) % n;
    var it = items[current];
    var token = ++loadToken;

    // Show the cached display image at once, then swap in the full-size JPEG.
    lbImg.src = it.display;
    lbImg.alt = it.alt || '';
    var full = new Image();
    full.onload = function () { if (token === loadToken) lbImg.src = it.full; };
    full.src = it.full;

    lbTitle.textContent = it.number + ' ' + it.facet;
    lbStyle.textContent = person.name;
    lbDesc.textContent = it.description_1;
    lbEvidence.textContent = it.description_2;
    lbPos.textContent = (current + 1) + ' / ' + n;
    lbFull.href = it.full;
  }

  function open(i, trigger) {
    show(i);
    lastTrigger = trigger;
    if (!lb.open) lb.showModal();
  }

  document.getElementById('lb-close').addEventListener('click', function () { lb.close(); });
  document.getElementById('lb-prev').addEventListener('click', function () { show(current - 1); });
  document.getElementById('lb-next').addEventListener('click', function () { show(current + 1); });

  // A click on the backdrop (outside the image, caption, and buttons) closes the lightbox.
  lb.addEventListener('click', function (e) {
    if (e.target === lb || e.target.classList.contains('lb-inner')) lb.close();
  });

  lb.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(current - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); show(current + 1); }
  });

  lb.addEventListener('close', function () {
    loadToken++;
    lbImg.removeAttribute('src');
    if (lastTrigger) lastTrigger.focus();
  });

  // Swipe left and right on touch screens.
  var sx = 0, sy = 0, tracking = false;
  lb.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tracking = false; return; }
    tracking = true;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) show(current + (dx < 0 ? 1 : -1));
  }, { passive: true });

  // Facet order comes from people.json. Never shuffle. no-cache revalidates after each deploy.
  function getJson(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  Promise.all([
    getJson('/gallery/series/{{SERIES}}/people.json'),
    getJson('/gallery/series/{{SERIES}}/series.json')
  ])
    .then(function (res) {
      var people = (res[0] && res[0].people) || [];
      person = people.filter(function (p) { return p.slug === slug; })[0];
      if (!person || !Array.isArray(person.facets) || !person.facets.length) throw new Error('not found');
      items = person.facets.slice();
      render(res[1]);
    })
    .catch(showError);
})();
</script>

</body>
</html>
